<div class="col-md-4 mb-4">
    <div class="card h-100">
        {% if cuadro.imagen %}
            <img src="{{ url_for('static', filename='images/' + cuadro.imagen) }}" class="card-img-top" alt="{{ cuadro.nombre }}" style="height: 200px; object-fit: cover;">
        {% endif %}
        <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ cuadro.nombre }}</h5>
            <p class="card-text flex-grow-1">{{ cuadro.descripcion }}</p>
            <p class="card-text"><strong>${{ "%.2f"|format(cuadro.precio) }}</strong></p>
        </div>
    </div>
</div>
